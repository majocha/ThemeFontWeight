name: Build

# Every push to main and every pull request: build, test and keep the VSIX as a workflow artifact.
# Every push to main: upload the VSIX to the Open VSIX Gallery (nightly feed).
# A push to main with "[release]" in the commit message, or a manual run: also publish to the
# Visual Studio Marketplace and make a GitHub release.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The last part of the version is the commit count (Directory.Build.targets).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # ThemeFontWeight.Tests runs on .NET 10.
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ThemeFontWeight.sln -c Release --nologo -v minimal

      - name: Test
        run: |
          dotnet run --project tests/ThemeFontWeight.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/ThemeFontWeight.Formatting.Tests/bin/Release/net48/ThemeFontWeight.Formatting.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Get version
        id: version
        run: |
          $height = git rev-list --count HEAD
          [xml] $props = Get-Content Directory.Build.props
          $majorMinor = $props.Project.PropertyGroup.VersionMajorMinor
          "version=$majorMinor.$height" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ThemeFontWeight.vsix
          path: src/ThemeFontWeight/bin/Release/net48/ThemeFontWeight.vsix
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # GitHub release
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ThemeFontWeight.vsix
          path: artifact

      # Publish-Vsix.ps1 uses VsixPublisher.exe from the Microsoft.VSSDK.BuildTools package.
      - uses: actions/setup-dotnet@v4
        if: env.RELEASE == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: env.RELEASE == 'true'
        run: dotnet restore src/ThemeFontWeight/ThemeFontWeight.fsproj

      - name: Upload to Open VSIX Gallery
        uses: timheuer/openvsixpublish@v1
        with:
          vsix-file: artifact/ThemeFontWeight.vsix

      - name: Publish to Visual Studio Marketplace
        if: env.RELEASE == 'true'
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: ./Publish-Vsix.ps1 -Vsix artifact/ThemeFontWeight.vsix

      - name: GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifact/ThemeFontWeight.vsix
